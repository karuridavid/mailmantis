<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0b0b0d"/>
  <g fill="none" stroke="#8cc461" stroke-linecap="round" stroke-linejoin="round">
    <!-- antennae: short and fine -->
    <path d="M44.5 10.5 Q49 5.5 54.5 4.5" stroke-width="1.3"/>
    <path d="M42.5 11 Q44.5 5 48.5 2.5" stroke-width="1.3"/>
    <!-- prothorax: long, upright "neck" -->
    <path d="M30.5 38 L39.5 16.5" stroke-width="4.2"/>
    <!-- raptorial forelegs held up in the praying pose: femur forward, tibia folded back with a hook -->
    <path d="M36.5 23.5 L47.5 29.5 L45.5 20.5 L47.5 19" stroke-width="3.2"/>
    <!-- middle and hind legs -->
    <path d="M31 39.5 L36 47.5 L40 57" stroke-width="2.1"/>
    <path d="M28.5 40.5 L24.5 49 L27.5 57.5" stroke-width="2.1"/>
    <path d="M26 41 L18 49.5 L13.5 57.5" stroke-width="2.1"/>
  </g>
  <g fill="#8cc461">
    <!-- abdomen under folded wings: a long leaf -->
    <path d="M33 36.5 C26.5 34.5 13 38.5 4.5 49.5 C16 50 28 45 33.5 40 Z"/>
    <!-- head: wide triangle, chin pointing down -->
    <path d="M35.5 13.5 L47 9.5 L44.5 19.5 Z"/>
  </g>
  <circle cx="44.2" cy="12.3" r="1.7" fill="#0b0b0d"/>
</svg>
